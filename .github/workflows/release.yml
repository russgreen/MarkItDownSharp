name: Release

# Publishes a signed MSIX when a version tag such as v0.2.0 is pushed.
# Needs two repository secrets:
#   SIGNING_CERT_BASE64   the release code-signing certificate (PFX), base64 encoded
#   SIGNING_CERT_PASSWORD the PFX password
# The certificate subject becomes the package publisher, so it must stay the same for every release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Check signing secrets
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) { throw 'SIGNING_CERT_BASE64 is not configured. A release must be signed.' }
      - name: Test
        run: dotnet test tests/MarkItDownSharp.Tests/MarkItDownSharp.Tests.csproj --configuration Release
      - name: Decode certificate
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          [IO.File]::WriteAllBytes("$PWD/artifacts/release.pfx", [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
      - name: Build and sign MSIX
        id: build
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = "$tag.0"
          $package = ./build/Build-Msix.ps1 -Version $version -PfxPath artifacts/release.pfx | Select-Object -Last 1
          "package=$package" >> $env:GITHUB_OUTPUT
      - name: Verify signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature '${{ steps.build.outputs.package }}'
          if ($signature.Status -notin 'Valid', 'UnknownError') { throw "Unexpected signature status: $($signature.Status)" }
          $signature.SignerCertificate | Format-List Subject, Thumbprint, NotAfter
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' '${{ steps.build.outputs.package }}' --generate-notes --title '${{ github.ref_name }}'
      - name: Remove certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue artifacts/release.pfx
